# =============================================================================
# imgtrans 图片翻译服务 —— nginx 反代站点配置（模板）
#
# 这是**模板**，@PORT@ 由 deploy/install.sh 替换后安装到
#   /etc/nginx/sites-available/imgtrans.conf
#   并软链到 /etc/nginx/sites-enabled/imgtrans.conf
#
# 手工安装：把下面的 @PORT@ 改成 .env 里的 IMGTRANS_PORT（默认 8000），
# 然后 ln -sfn /etc/nginx/sites-available/imgtrans.conf /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#
# 两个参数改动就是本文件存在的理由（默认值都会让线上出故障）：
#   client_max_body_size 64m  —— base64 有 33% 膨胀，20MB 图 = 27MB 请求体，
#                                nginx 默认 1m，直接 413，而调用方只会看到"上传失败"
#   proxy_read_timeout 180s   —— 单图 12~20s，默认 60s 会把 OCR 请求掐断，
#                                表现为 504，且服务端日志里什么都看不到（请求还没返回）
#
# 鉴权说明：/v1/ 路径的鉴权由**服务自身**处理（请求头 X-Api-Key 或
# Authorization: Bearer）。nginx 不要在这里重复加 auth_basic —— 两套认证叠加后，
# 调用方以为带了 key 就够了，实际被 401 挡在 nginx 层，排查方向会完全错。
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    # 未绑域名：按 IP 直接访问也能用。有域名时改成 server_name api.example.com;
    # 注意不要加 default_server（会跟其它站点抢默认虚拟主机）。
    server_name _;

    # 上限 64m：给 20MB 图片留足 base64 膨胀（27MB）+ JSON 外壳 + 其它字段的余量
    client_max_body_size 64m;
    # 请求体落盘缓冲：27MB 的 JSON 先在磁盘上收全再转给后端，避免后端读一半被中断
    client_body_buffer_size 1m;
    # 后端 180s 内没响应才判超时（覆盖单图 12~20s 的 P100，含冷启动）
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    access_log /var/log/nginx/imgtrans.access.log;
    error_log  /var/log/nginx/imgtrans.error.log warn;

    # ---- 健康检查：关掉访问日志 ----------------------------------------------
    # /healthz 会被监控/负载均衡每秒打一次，不关会把 access.log 刷成几十 G
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 健康检查要快失败：后端卡住时应立刻返回 502，而不是跟着等 180s
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # ---- 业务接口 ------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;

        # 保留客户端真实 IP，服务端日志/限流都依赖它
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection：1.1 下 keep-alive 才能被正确复用/关闭
        proxy_set_header Connection        "";

        # 透传鉴权头（某些反代默认会过滤自定义头，显式写一遍更保险）
        proxy_set_header X-Api-Key         $http_x_api_key;
        proxy_set_header Authorization     $http_authorization;

        # 响应是 JSON（含 base64 图片），约 600KB~几 MB。
        # 只对 JSON 开 gzip：PNG 已经压缩过，再 gzip 只是白烧 CPU。
        gzip on;
        gzip_types application/json;
        gzip_min_length 4k;
        gzip_proxied any;
        gzip_comp_level 5;

        # 若想把请求体直接流给后端（省一次落盘），打开下面这行；
        # 代价是后端要自己扛慢连接，单实例 OCR 场景不建议。
        # proxy_request_buffering off;
    }

    # 老接口返回二进制图片（image/png）：不要让 gzip 插手
    location ~ ^/v1/translate(/upload)?$ {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header X-Api-Key         $http_x_api_key;
        proxy_set_header Authorization     $http_authorization;
        # 二进制响应不压缩，避免二次编码
        gzip off;
    }
}

# =============================================================================
# HTTPS（可选，推荐）
#
# 方式一：certbot 自动改这份配置（最省事）
#   apt-get install -y certbot python3-certbot-nginx
#   certbot --nginx -d api.example.com
#   # 它会自己加 listen 443 ssl、证书路径、以及 80 → 443 的跳转
#   # 完事确认一下 client_max_body_size / proxy_read_timeout 还在（certbot 通常不动 server 块内其它指令）
#   nginx -t && systemctl reload nginx
#
# 方式二：手写。certbot 的证书固定放在 /etc/letsencrypt/live/<域名>/ 下
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name api.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     client_max_body_size 64m;
#     proxy_send_timeout 180s;
#     proxy_read_timeout 180s;
#
#     location / {
#         proxy_pass http://127.0.0.1:@PORT@;
#         proxy_http_version 1.1;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header Connection        "";
#     }
# }
#
# 开了 HTTPS 后，把上面 80 的 server 块改成只做跳转：
#   return 301 https://$host$request_uri;
# 证书自动续期：systemctl list-timers | grep certbot（certbot 自带 timer，无需 crontab）
# =============================================================================
